platforms: []
capabilities:
  provides_tools:
    - jev_route
  provides_hooks:
    - pre_llm_call
    - post_api_request
    - on_session_delete
  provides_middleware:
    - llm_request
  requires_env:
    - TYPESAFE_API_KEY
