description: "Desktop RSS reader with reader-mode capture, drag-reorder subscriptions, mute rules, saved searches, AI summaries, keyboard shortcuts, an optional headline ticker, a daily-digest automation blueprint, and Telegram/Discord digest posts with inline Save, Open, and Mute buttons. Disclosure: optional YouTube cookies you paste in Settings are sent with YouTube feed requests; selectable User-Agent presets (incl. a ChatGPT-User string) are sent to feed hosts; YouTube videos render as youtube-nocookie.com embed iframes inside the reader; /rss digest-post reads gateway.session_context to learn which chat the command came from (the same read the core /blueprint command uses), guarded, and degrades to a text digest without it."
