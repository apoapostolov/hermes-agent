description: "Keeps the session list readable as the topic drifts. Every N titleable user messages, retitles from the latest exchanges. A title you set yourself is never overwritten. Disclosure: writes the new title through agent.title_generator and hermes_state.SessionDB because no plugin SDK title-write seam exists yet; those imports are guarded and a failed write is logged, never raised."
maintainer: apoapostolov
tier: community
category: desktop
